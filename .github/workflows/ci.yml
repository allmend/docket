name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet and gofmt
        run: make vet

      - name: Build
        run: go build ./...

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build static assets
        run: |
          npm ci
          make assets

      - name: Asset size budget
        run: make budget

      # Store tests start Postgres with testcontainers (Docker is on the
      # runner). DOCKET_TEST_REQUIRE_DB makes them fail instead of skip.
      - name: Test
        env:
          DOCKET_TEST_REQUIRE_DB: "1"
        run: go test -count=1 ./...
