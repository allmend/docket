apiVersion: apps/v1
kind: Deployment
metadata:
  name: docket
  namespace: docket
  labels:
    app: docket
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docket
  template:
    metadata:
      labels:
        app: docket
      annotations:
        # Restart pods when the secret changes (checksum-based rollout trigger).
        # Remove if you manage rollouts manually.
        kubectl.kubernetes.io/restartPolicy: Always
    spec:
      # Must exceed SHUTDOWN_DELAY (5s) plus the longest request (30s write
      # timeout), or the kubelet kills the pod mid-drain.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532   # distroless nonroot
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: docket
          # An exact version: you decide when to upgrade. See
          # docs/operations.md for the tags and the upgrade checklist.
          image: ghcr.io/allmend/docket:0.19.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9412
              protocol: TCP
            # /livez and /readyz for the kubelet only — not in the Service or
            # the HTTPRoute, so they never reach the internet.
            - name: health
              containerPort: 9413
              protocol: TCP
          env:
            - name: MODE
              value: "all"
            - name: HTTP_PORT
              value: "8081"
            - name: METRICS_PORT
              value: "9412"
            # Loopback by default, which nothing outside the pod can reach.
            # Prometheus scrapes across the pod network, so bind wide and keep
            # the port unexposed by any Service (see networkpolicy.yaml).
            - name: METRICS_ADDR
              value: "0.0.0.0"
            # Session cookies are marked Secure by default, and browsers discard
            # those over plain HTTP — login appears to fail with correct
            # credentials. Terminate TLS at the Gateway, or set this to "false"
            # if the instance is only reachable over HTTP on a trusted network.
            # - name: COOKIE_SECURE
            #   value: "false"
          envFrom:
            - secretRef:
                name: docket
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Startup covers migrations: up to 60s before liveness takes over,
          # so a slow migration is not mistaken for a hung process.
          startupProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          # Liveness never checks the database: a Postgres outage must make
          # pods NotReady, not restart all of them at once.
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 10
            failureThreshold: 3
          # Readiness pings Postgres and fails during the shutdown drain.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            failureThreshold: 2
      # Pull from GHCR — public images don't need imagePullSecrets.
      # If you fork to a private registry, add an imagePullSecret here.
