apiVersion: v1
kind: Service
metadata:
  name: docket
  namespace: docket
  labels:
    app: docket
spec:
  selector:
    app: docket
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
# The metrics port is deliberately absent: PodMonitor scrapes pods directly, so
# putting /metrics behind a load-balanced Service would only hide replicas and
# widen what can reach an unauthenticated endpoint.
