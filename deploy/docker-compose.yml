# Docket — self-hosted deployment
#
# Copy this file somewhere, create a .env file next to it (see below), then:
#   docker compose up -d
#
# Minimum .env (Docket refuses to start with the placeholders below):
#   JWT_SECRET=<at least 32 random bytes: openssl rand -hex 32>
#   SEED_PASSWORD=<initial admin password, needed on first start only>
#
# Optional overrides (defaults shown):
#   HTTP_PORT=8081
#   SEED_ORG_NAME=My Team
#   SEED_ORG_SLUG=myteam
#   SEED_USERNAME=admin
#   SEED_NAME=Admin
#   SEED_EMAIL=admin@example.com

services:
  app:
    image: ghcr.io/allmend/docket:latest
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "9412:9412"   # Prometheus metrics — restrict this port in production
      # Health (9413) stays unpublished; the healthcheck below runs inside.
    environment:
      DATABASE_URL: postgres://docket:docket@postgres:5432/docket?sslmode=disable
      HTTP_PORT: "8081"
      METRICS_PORT: "9412"
      MODE: all
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SEED_ORG_NAME: ${SEED_ORG_NAME:-My Team}
      SEED_ORG_SLUG: ${SEED_ORG_SLUG:-myteam}
      SEED_USERNAME: ${SEED_USERNAME:-admin}
      SEED_NAME: ${SEED_NAME:-Admin}
      SEED_EMAIL: ${SEED_EMAIL:-admin@example.com}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    # The image is distroless (no shell, no curl), so the binary checks itself:
    # `docket healthcheck` exits 0 when /readyz on the health port answers 200.
    healthcheck:
      test: ["CMD", "/docket", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: docket
      POSTGRES_PASSWORD: docket
      POSTGRES_DB: docket
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docket"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
